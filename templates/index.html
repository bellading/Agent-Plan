<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPlan</title>
<style>
  :root {
    --bg: #f6efe0;
    --sidebar-bg: #efe4cd;
    --card-bg: #fffcf5;
    --border: #e3d5b2;
    --border-strong: #d3c093;
    --text: #4a3f2f;
    --text-muted: #8a7c60;
    --accent: #b5793f;
    --accent-dark: #96602c;
    --high: #e8b4a0;
    --med: #ecd39a;
    --low: #b9d1ab;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    width: 190px; flex-shrink: 0; background: var(--sidebar-bg);
    border-right: 1px solid var(--border-strong); padding: 24px 14px; display: flex; flex-direction: column; gap: 6px;
    transition: width 0.18s ease, padding 0.18s ease; overflow: hidden;
  }
  .sidebar.collapsed { width: 60px; padding: 24px 10px; }
  .sidebar-header { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .sidebar.collapsed .sidebar-header { justify-content: center; }
  .sidebar h1 { font-size: 16px; margin: 0; color: var(--accent-dark); white-space: nowrap; }
  .sidebar.collapsed h1 { display: none; }
  .sidebar-toggle-btn {
    background: transparent; border: 1px solid var(--border-strong); border-radius: 7px;
    color: var(--accent-dark); padding: 5px 6px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .sidebar-toggle-btn:hover { background: rgba(181, 121, 63, 0.15); }
  .nav-item {
    padding: 11px 14px; border-radius: 10px; cursor: pointer; font-size: 14px;
    color: var(--text); transition: background 0.15s; white-space: nowrap; overflow: hidden;
  }
  .sidebar.collapsed .nav-item { text-align: center; padding: 11px 4px; font-size: 12px; }
  .nav-item:hover { background: rgba(181, 121, 63, 0.12); }
  .nav-item.active { background: var(--accent); color: white; font-weight: 600; }

  /* Main area */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .view { flex: 1; display: none; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  /* Shared field styling: visible rounded border everywhere */
  input[type=text], select, textarea {
    border: 1.5px solid var(--border-strong); border-radius: 9px; background: var(--card-bg);
    font-family: inherit; font-size: 13px; color: var(--text); padding: 7px 10px;
  }
  input[type=text]:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
  }
  button {
    border: none; border-radius: 9px; background: var(--accent); color: white;
    padding: 8px 18px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { background: #cbbfa0; cursor: default; }
  button.ghost { background: transparent; color: var(--text-muted); padding: 6px 10px; }
  button.ghost:hover { background: rgba(0,0,0,0.06); color: var(--text); }
  button.danger { background: transparent; color: #a8503a; padding: 4px 10px; font-size: 16px; line-height: 1; }
  button.danger:hover { background: rgba(168, 80, 58, 0.12); }
  button.stop-btn { background: #a8503a; }
  button.stop-btn:hover { background: #8c4230; }

  select.high { background-color: var(--high); }
  select.med { background-color: var(--med); }
  select.low { background-color: var(--low); }

  /* Plan list view */
  #view-plan { padding: 24px 32px; overflow-y: auto; }
  .plan-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .plan-header h2 { margin: 0; font-size: 19px; }

  .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; max-width: 800px; }
  .category-tile {
    background: var(--card-bg); border: 1.5px solid var(--border); border-radius: 18px;
    padding: 26px 16px; text-align: center; cursor: pointer;
    transition: transform .12s, box-shadow .12s, border-color .12s;
    box-shadow: 0 1px 3px rgba(80, 60, 20, 0.06);
  }
  .category-tile:hover { transform: translateY(-2px); box-shadow: 0 5px 16px rgba(80, 60, 20, 0.13); border-color: var(--accent); }
  .category-tile .tile-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .category-tile .tile-count { font-size: 12px; color: var(--text-muted); }
  .category-tile.add-tile { border-style: dashed; }
  .category-tile.add-tile .tile-plus { font-size: 26px; color: var(--accent); line-height: 1; margin-bottom: 4px; }
  .category-tile.add-tile .tile-name { color: var(--text-muted); font-weight: 500; font-size: 13px; }

  .category-title {
    font-size: 14px; font-weight: 600; color: var(--accent-dark); margin: 0 0 10px 2px;
    display: flex; align-items: center; gap: 8px;
  }
  .task-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 10px; box-shadow: 0 1px 2px rgba(80, 60, 20, 0.05);
  }
  .task-card.done { opacity: 0.55; }
  .task-card.done input[type=text], .task-card.done textarea { text-decoration: line-through; }
  .card-summary { display: flex; align-items: center; gap: 8px; }
  .card-summary .title-input { flex: 1; min-width: 120px; font-size: 14px; font-weight: 500; }
  .expand-toggle {
    padding: 4px 8px; font-size: 13px; line-height: 1; transition: transform 0.15s;
  }
  .task-card.expanded .expand-toggle { transform: rotate(180deg); }
  .card-details { display: none; margin-top: 10px; }
  .task-card.expanded .card-details { display: block; }
  .card-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .card-row:last-child { margin-bottom: 0; }
  .card-row select { min-width: 78px; }
  .card-row input[type=text].datetime { width: 150px; }
  .task-card textarea { width: 100%; min-height: 2.4em; resize: vertical; }
  .empty-hint { color: var(--text-muted); font-size: 13px; padding: 4px 2px 18px; }

  .new-task-form {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 22px;
  }
  .new-task-form h2 { font-size: 14px; margin: 0 0 12px; color: var(--accent-dark); }
  .new-task-form .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .new-task-form input[type=text] { flex: 1; min-width: 140px; }
  .new-task-form textarea { width: 100%; min-height: 2.6em; resize: vertical; }

  /* Chat view */
  #view-chat { padding: 0; }
  .chat-layout { flex: 1; display: flex; min-height: 0; }
  .chat-conv-list {
    width: 180px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 14px 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
  }
  .conv-new-btn {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    background: transparent; border: 1.5px dashed var(--border-strong); color: var(--accent-dark);
    border-radius: 9px; padding: 8px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .conv-new-btn:hover { background: rgba(181, 121, 63, 0.1); }
  .conv-items { display: flex; flex-direction: column; gap: 4px; }
  .conv-item {
    padding: 8px 10px; border-radius: 9px; cursor: pointer; font-size: 13px;
    border: 1px solid transparent; display: flex; align-items: center; gap: 4px;
  }
  .conv-item:hover { background: rgba(181, 121, 63, 0.1); }
  .conv-item.active { background: var(--card-bg); border-color: var(--border-strong); }
  .conv-item-main { flex: 1; min-width: 0; }
  .conv-item .conv-title {
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text);
  }
  .conv-item.active .conv-title { font-weight: 600; color: var(--accent-dark); }
  .conv-item .conv-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .conv-delete-btn {
    opacity: 0; flex-shrink: 0; background: transparent; color: var(--text-muted);
    border: none; padding: 3px 6px; font-size: 14px; line-height: 1; border-radius: 6px; cursor: pointer;
  }
  .conv-item:hover .conv-delete-btn { opacity: 0.6; }
  .conv-delete-btn:hover { opacity: 1 !important; background: rgba(168, 80, 58, 0.15); color: #a8503a; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { padding: 18px 28px 12px; border-bottom: 1px solid var(--border); }
  .chat-header h2 { margin: 0; font-size: 19px; }
  .chat-header p { margin: 4px 0 0; font-size: 12px; color: var(--text-muted); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 20px 28px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 68%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; }
  .msg.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: var(--card-bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg-text { white-space: pre-wrap; }
  .msg-text p { margin: 0 0 6px; }
  .msg-text p:last-child { margin-bottom: 0; }
  .msg-text h3, .msg-text h4, .msg-text h5, .msg-text h6 {
    margin: 10px 0 4px; font-size: 1em; font-weight: 700; line-height: 1.4;
  }
  .msg-text h3:first-child, .msg-text h4:first-child { margin-top: 0; }
  .msg-text ul { margin: 2px 0 8px; padding-left: 20px; }
  .msg-text li { margin-bottom: 2px; }
  .msg-text hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg.user .msg-text hr { border-top-color: rgba(255,255,255,0.3); }
  .msg-text strong { font-weight: 700; }
  .msg.streaming .msg-text::after {
    content: '▍'; display: inline-block; margin-left: 2px; color: var(--accent);
    animation: blink 0.9s step-start infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .msg-meta { display: flex; align-items: center; gap: 6px; margin-top: 6px; opacity: 0.75; }
  .msg-time { font-size: 11px; color: var(--text-muted); }
  .msg.user .msg-time { color: rgba(255,255,255,0.75); }
  .meta-btn {
    background: transparent; border: none; color: inherit; opacity: 0.7;
    font-size: 12px; padding: 2px 4px; cursor: pointer; border-radius: 5px; line-height: 1;
  }
  .meta-btn:hover { opacity: 1; background: rgba(0,0,0,0.08); }
  .msg.user .meta-btn:hover { background: rgba(255,255,255,0.18); }
  .feedback-btn.active { opacity: 1; background: rgba(181, 121, 63, 0.18); }
  .msg-text a { color: var(--accent); text-decoration: underline; word-break: break-all; }
  .msg.user .msg-text a { color: #fff; text-decoration-color: rgba(255,255,255,0.6); }
  .msg-choices { display: flex; gap: 8px; margin-top: 8px; }
  .choice-btn {
    padding: 6px 16px; border-radius: 16px; border: 1.5px solid var(--border-strong);
    background: var(--bg); color: var(--text); font-size: 13px; cursor: pointer;
  }
  .choice-btn:hover { border-color: var(--accent); background: rgba(181, 121, 63, 0.1); }
  .choice-btn:disabled { opacity: 0.5; cursor: default; }
  .choice-btn.chosen { background: var(--accent); color: white; border-color: var(--accent); }
  .chat-input-row { display: flex; gap: 10px; padding: 16px 28px; border-top: 1px solid var(--border); }
  .chat-input-row input[type=text] { flex: 1; padding: 11px 14px; font-size: 14px; }

  /* User badge + menu, bottom-left of sidebar */
  .user-area { margin-top: auto; position: relative; }
  .user-badge {
    display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 10px;
    cursor: pointer; border: 1px solid transparent;
  }
  .user-badge:hover { background: rgba(181, 121, 63, 0.12); }
  .user-avatar {
    width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: white;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;
    flex-shrink: 0;
  }
  .user-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar.collapsed .user-name { display: none; }
  .sidebar.collapsed .user-badge { justify-content: center; padding: 8px 4px; }
  .user-menu {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 170px;
    background: var(--card-bg); border: 1px solid var(--border-strong); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(80, 60, 20, 0.15); padding: 6px; z-index: 10;
  }
  .user-menu.open { display: block; }
  .user-menu-name { font-size: 12px; color: var(--text-muted); padding: 8px 10px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .user-menu button {
    display: block; width: 100%; text-align: left; background: transparent; color: var(--text);
    border-radius: 8px; padding: 8px 10px; font-size: 13px;
  }
  .user-menu button:hover { background: rgba(181, 121, 63, 0.12); }

  /* Dialog */
  dialog#app-dialog {
    border: none; border-radius: 14px; padding: 0; max-width: 380px; width: 90%;
    box-shadow: 0 8px 30px rgba(0,0,0,0.18); background: var(--card-bg); color: var(--text);
  }
  dialog#app-dialog::backdrop { background: rgba(60, 45, 20, 0.35); }
  dialog#app-dialog .dialog-body { padding: 22px 22px 6px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; }
  dialog#app-dialog input[type=text] { display: block; width: calc(100% - 44px); margin: 4px 22px 0; }
  dialog#app-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 16px 22px 20px; }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <button class="sidebar-toggle-btn" id="sidebar-toggle" title="收起/展开导览">
      <svg width="16" height="14" viewBox="0 0 16 14" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="0.5" y="0.5" width="15" height="13" rx="2.5" stroke="currentColor"/>
        <line x1="5.5" y1="1" x2="5.5" y2="13" stroke="currentColor"/>
      </svg>
    </button>
    <h1>AgentPlan</h1>
  </div>
  <div class="nav-item" data-view="chat" data-full="AI 问答" data-short="问答">AI 问答</div>
  <div class="nav-item active" data-view="plan" data-full="计划列表" data-short="计划">计划列表</div>

  <div class="user-area">
    <div class="user-menu" id="user-menu">
      <div class="user-menu-name">{{ username }}</div>
      <button type="button" id="settings-btn">设置提醒邮箱</button>
      <form method="POST" action="/logout"><button type="submit">退出登录</button></form>
    </div>
    <div class="user-badge" id="user-badge">
      <div class="user-avatar">{{ username[0]|upper if username else '?' }}</div>
      <div class="user-name">{{ username }}</div>
    </div>
  </div>
</div>

<div class="main">

  <div class="view active" id="view-plan">

    <div id="plan-grid">
      <div class="plan-header"><h2>计划列表</h2></div>
      <div class="category-grid" id="category-grid"></div>
    </div>

    <div id="plan-detail" style="display:none;">
      <div class="plan-header">
        <button class="ghost" id="back-to-grid">← 返回</button>
        <h2 id="detail-title"></h2>
      </div>

      <div class="new-task-form">
        <h2>新建任务</h2>
        <div class="row">
          <input id="new-title" type="text" placeholder="主题（必填）">
          <select id="new-type"><option value="single">单次</option><option value="goal">目标</option></select>
        </div>
        <div class="row">
          <select id="new-importance"><option value="">重要度</option><option value="high">高</option><option value="med">中</option><option value="low">低</option></select>
          <select id="new-urgency"><option value="">紧急度</option><option value="high">高</option><option value="med">中</option><option value="low">低</option></select>
          <select id="new-action"><option value="">动作</option><option value="now">立即</option><option value="schedule">排期</option><option value="routine">日常</option><option value="drop">舍弃</option></select>
          <input id="new-remind_at" type="text" class="datetime" placeholder="提醒 2026-09-20 09:00">
          <input id="new-deadline" type="text" class="datetime" placeholder="截止 2026-09-20 00:00">
        </div>
        <div class="row"><textarea id="new-notes" placeholder="备注 / 计划"></textarea></div>
        <button id="add-task-btn">添加</button>
      </div>

      <div id="detail-tasks"></div>
    </div>

  </div>

  <div class="view" id="view-chat">
    <div class="chat-layout">
      <div class="chat-conv-list">
        <button class="conv-new-btn" id="conv-new-btn">+ 新对话</button>
        <div class="conv-items" id="conv-items"></div>
      </div>
      <div class="chat-main">
        <div class="chat-header">
          <h2>AI 问答</h2>
          <p>随便聊聊你要做的事，我会追问清楚时间、给建议，聊明白了再帮你记下来</p>
        </div>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-row">
          <input id="chat-input" type="text" placeholder="说说你想做的事…">
          <button id="chat-send-btn">发送</button>
          <button id="chat-stop-btn" class="stop-btn" style="display:none">停止</button>
        </div>
      </div>
    </div>
  </div>

</div>

<dialog id="app-dialog">
  <div class="dialog-body" id="app-dialog-body"></div>
  <input type="text" id="app-dialog-input" style="display:none">
  <div class="dialog-actions">
    <button class="ghost" id="app-dialog-cancel" style="display:none">取消</button>
    <button id="app-dialog-ok">好的</button>
  </div>
</dialog>

<script>
const LEVELS = ['', 'high', 'med', 'low'];
const ACTIONS = ['', 'now', 'schedule', 'routine', 'drop'];
const STATUSES = ['todo', 'doing', 'done', 'missed', 'routine', 'dropped'];

const LEVEL_LABELS = { '': '未设置', high: '高', med: '中', low: '低' };
const ACTION_LABELS = { '': '未设置', now: '立即', schedule: '排期', routine: '日常', drop: '舍弃' };
const STATUS_LABELS = { todo: '待办', doing: '进行中', done: '已完成', missed: '错过', routine: '日常', dropped: '已舍弃' };

let knownCategories = [];
let currentCategory = null;
let expandedTaskIds = new Set();

// ---------- dialog ----------
const dialog = document.getElementById('app-dialog');
const dialogBody = document.getElementById('app-dialog-body');
const dialogInput = document.getElementById('app-dialog-input');
const dialogOk = document.getElementById('app-dialog-ok');
const dialogCancel = document.getElementById('app-dialog-cancel');
dialog.addEventListener('click', e => { if (e.target === dialog) dialog.close(); });

function showDialog(message) {
  dialogBody.textContent = message;
  dialogInput.style.display = 'none';
  dialogCancel.style.display = 'none';
  dialogOk.textContent = '好的';
  dialogOk.onclick = () => dialog.close();
  dialog.showModal();
}

function showConfirm(message) {
  return new Promise(resolve => {
    dialogBody.textContent = message;
    dialogInput.style.display = 'none';
    dialogCancel.style.display = 'inline-block';
    dialogOk.textContent = '删除';
    dialogOk.onclick = () => { dialog.close(); resolve(true); };
    dialogCancel.onclick = () => { dialog.close(); resolve(false); };
    dialog.showModal();
  });
}

function showPrompt(message, placeholder, prefill) {
  return new Promise(resolve => {
    dialogBody.textContent = message;
    dialogInput.style.display = 'block';
    dialogInput.value = prefill || '';
    dialogInput.placeholder = placeholder || '';
    dialogCancel.style.display = 'inline-block';
    dialogOk.textContent = '确定';
    const submit = () => { const v = dialogInput.value.trim(); dialog.close(); resolve(v || null); };
    dialogOk.onclick = submit;
    dialogCancel.onclick = () => { dialog.close(); resolve(null); };
    dialogInput.onkeydown = e => { if (e.key === 'Enter') submit(); };
    dialog.showModal();
    dialogInput.focus();
  });
}

// ---------- nav ----------
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    item.classList.add('active');
    document.getElementById(`view-${item.dataset.view}`).classList.add('active');
    if (item.dataset.view === 'chat') scrollChatToBottom();
  });
});

// ---------- sidebar collapse ----------
const sidebar = document.getElementById('sidebar');

function setSidebarCollapsed(collapsed) {
  sidebar.classList.toggle('collapsed', collapsed);
  document.querySelectorAll('.nav-item').forEach(item => {
    item.textContent = collapsed ? item.dataset.short : item.dataset.full;
  });
  try { localStorage.setItem('agentplan-sidebar-collapsed', collapsed ? '1' : '0'); } catch (e) {}
}

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  setSidebarCollapsed(!sidebar.classList.contains('collapsed'));
});

try {
  setSidebarCollapsed(localStorage.getItem('agentplan-sidebar-collapsed') === '1');
} catch (e) {}

// ---------- user menu ----------
const userBadge = document.getElementById('user-badge');
const userMenu = document.getElementById('user-menu');

userBadge.addEventListener('click', e => {
  e.stopPropagation();
  userMenu.classList.toggle('open');
});

document.addEventListener('click', () => userMenu.classList.remove('open'));

document.getElementById('settings-btn').addEventListener('click', async () => {
  userMenu.classList.remove('open');
  const res = await fetch('/api/settings');
  const current = await res.json();
  const email = await showPrompt(
    '设置提醒邮箱（任务快到期时会发邮件提醒你，留空等于不提醒）',
    'you@example.com',
    current.email || ''
  );
  if (email === null) return;
  const saveRes = await fetch('/api/settings/email', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });
  if (!saveRes.ok) {
    const err = await saveRes.json().catch(() => ({}));
    showDialog(err.error || '保存失败');
    return;
  }
  showDialog(email ? `提醒邮箱已设置为 ${email}` : '已清空提醒邮箱');
});

// ---------- shared helpers ----------
function esc(v) {
  return (v ?? '').toString()
    .replaceAll('&', '&amp;').replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;').replaceAll('"', '&quot;');
}

function linkify(escapedText) {
  // escapedText must already be HTML-escaped (see esc()) — this only
  // wraps plain http(s) URLs in a real <a>, nothing else touches markup.
  return escapedText.replace(
    /(https?:\/\/[^\s<]+[^\s<.,;:!?'")\]])/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
  );
}

function inlineFormat(escapedLine) {
  // bold, then links. Order matters: linkify only touches plain URL text,
  // so running it after ** stripping won't catch URLs inside **bold** —
  // acceptable since the AI doesn't bold links in practice.
  return linkify(escapedLine.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'));
}

function renderMarkdown(raw) {
  // Covers the subset the AI actually produces: #### headers, **bold**,
  // "- " bullet lists, "---" rules, paragraphs. Escapes first so this is
  // just as safe as the plain esc()+linkify() path it replaces.
  const lines = esc(raw).split('\n');
  let html = '';
  let inList = false;

  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (const line of lines) {
    const header = line.match(/^(#{1,6})\s+(.*)$/);
    const bullet = line.match(/^[-*]\s+(.*)$/);
    const rule = line.match(/^-{3,}$/);

    if (rule) {
      closeList();
      html += '<hr>';
    } else if (header) {
      closeList();
      const level = Math.min(header[1].length + 2, 6); // keep headers modest inside a chat bubble
      html += `<h${level}>${inlineFormat(header[2])}</h${level}>`;
    } else if (bullet) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineFormat(bullet[1])}</li>`;
    } else {
      closeList();
      html += line.trim() === '' ? '<br>' : `<p>${inlineFormat(line)}</p>`;
    }
  }
  closeList();
  return html;
}

function options(values, current, labels) {
  return values.map(v => {
    const label = labels ? (labels[v] ?? v) : (v || '—');
    return `<option value="${esc(v)}" ${v === (current ?? '') ? 'selected' : ''}>${esc(label)}</option>`;
  }).join('');
}

function effectiveCategory(cat) {
  return knownCategories.includes(cat) ? cat : '其他';
}

// ---------- category grid ----------
async function loadCategoryGrid() {
  const res = await fetch('/api/categories');
  const categories = await res.json();
  knownCategories = categories.map(c => c.name);

  const grid = document.getElementById('category-grid');
  grid.innerHTML = '';
  for (const c of categories) {
    const tile = document.createElement('div');
    tile.className = 'category-tile';
    tile.dataset.name = c.name;
    tile.innerHTML = `<div class="tile-name">${esc(c.name)}</div><div class="tile-count">${c.count} 项</div>`;
    grid.appendChild(tile);
  }
  const addTile = document.createElement('div');
  addTile.className = 'category-tile add-tile';
  addTile.id = 'add-category-tile';
  addTile.innerHTML = `<div class="tile-plus">+</div><div class="tile-name">自定义</div>`;
  grid.appendChild(addTile);
}

document.getElementById('category-grid').addEventListener('click', async e => {
  if (e.target.closest('#add-category-tile')) {
    const name = await showPrompt('给新的分类起个名字', '比如：摄影');
    if (!name) return;
    const res = await fetch('/api/categories', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showDialog(err.error || '添加失败');
      return;
    }
    loadCategoryGrid();
    return;
  }
  const tile = e.target.closest('.category-tile');
  if (tile) openCategoryDetail(tile.dataset.name);
});

function openCategoryDetail(name) {
  currentCategory = name;
  document.getElementById('plan-grid').style.display = 'none';
  document.getElementById('plan-detail').style.display = 'block';
  document.getElementById('detail-title').textContent = name;
  loadDetailTasks();
}

document.getElementById('back-to-grid').addEventListener('click', () => {
  document.getElementById('plan-detail').style.display = 'none';
  document.getElementById('plan-grid').style.display = 'block';
  loadCategoryGrid();
});

// ---------- task list within a category ----------
async function loadDetailTasks() {
  const res = await fetch('/api/tasks');
  const tasks = await res.json();
  const inCat = tasks.filter(t => effectiveCategory(t.category) === currentCategory);

  const container = document.getElementById('detail-tasks');
  container.innerHTML = '';
  if (inCat.length === 0) {
    container.innerHTML = `<div class="empty-hint">还没有${esc(currentCategory)}相关的计划</div>`;
    return;
  }
  for (const t of inCat) container.appendChild(renderTaskCard(t));
}

function renderTaskCard(t) {
  const card = document.createElement('div');
  const isExpanded = expandedTaskIds.has(String(t.id));
  card.className = 'task-card' + (t.status === 'done' ? ' done' : '') + (isExpanded ? ' expanded' : '');
  card.dataset.id = t.id;

  card.innerHTML = `
    <div class="card-summary">
      <input type="checkbox" class="done-check" ${t.status === 'done' ? 'checked' : ''}>
      <input type="text" class="title-input" data-field="title" value="${esc(t.title)}">
      <button class="ghost expand-toggle" title="展开/收起详情">▾</button>
      <button class="danger delete-btn" title="删除">×</button>
    </div>
    <div class="card-details">
      <div class="card-row">
        <select class="cat-select" data-field="category">${options(knownCategories, effectiveCategory(t.category))}</select>
        <select class="lvl-select ${t.importance ?? ''}" data-field="importance">${options(LEVELS, t.importance, LEVEL_LABELS)}</select>
        <select class="lvl-select ${t.urgency ?? ''}" data-field="urgency">${options(LEVELS, t.urgency, LEVEL_LABELS)}</select>
        <select data-field="action">${options(ACTIONS, t.action, ACTION_LABELS)}</select>
        <select data-field="status">${options(STATUSES, t.status, STATUS_LABELS)}</select>
      </div>
      <div class="card-row">
        <input type="text" class="datetime" data-field="remind_at" placeholder="提醒时间" value="${esc(t.remind_at)}">
        <input type="text" class="datetime" data-field="deadline" placeholder="截止时间" value="${esc(t.deadline)}">
      </div>
      <div class="card-row">
        <textarea data-field="notes" placeholder="备注 / 计划">${esc(t.notes)}</textarea>
      </div>
    </div>
  `;
  return card;
}

async function patchTask(id, fields) {
  const res = await fetch(`/api/tasks/${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(fields),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showDialog(err.error || '保存失败');
  }
  loadDetailTasks();
}

document.getElementById('detail-tasks').addEventListener('change', e => {
  const el = e.target;
  const id = el.closest('.task-card')?.dataset.id;
  if (!id) return;
  if (el.classList.contains('done-check')) {
    patchTask(id, { status: el.checked ? 'done' : 'todo' });
  } else if (el.dataset.field) {
    if (el.classList.contains('lvl-select')) el.className = `lvl-select ${el.value}`.trim();
    patchTask(id, { [el.dataset.field]: el.value || null });
  }
});

document.getElementById('detail-tasks').addEventListener('focusout', e => {
  const el = e.target;
  if (!el.dataset.field || el.tagName === 'SELECT') return;
  const id = el.closest('.task-card')?.dataset.id;
  if (!id) return;
  patchTask(id, { [el.dataset.field]: el.value });
});

document.getElementById('detail-tasks').addEventListener('click', async e => {
  if (e.target.classList.contains('expand-toggle')) {
    const card = e.target.closest('.task-card');
    const id = card.dataset.id;
    card.classList.toggle('expanded');
    if (card.classList.contains('expanded')) expandedTaskIds.add(id);
    else expandedTaskIds.delete(id);
    return;
  }

  if (!e.target.classList.contains('delete-btn')) return;
  const card = e.target.closest('.task-card');
  const id = card.dataset.id;
  const title = card.querySelector('.title-input').value;
  const confirmed = await showConfirm(`确定要删除"${title}"吗？删除后无法恢复。`);
  if (!confirmed) return;
  const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showDialog(err.error || '删除失败');
  }
  expandedTaskIds.delete(id);
  loadDetailTasks();
});

document.getElementById('add-task-btn').addEventListener('click', async () => {
  const title = document.getElementById('new-title').value.trim();
  if (!title) { showDialog('主题不能为空'); return; }

  const payload = {
    title,
    category: currentCategory,
    type: document.getElementById('new-type').value,
    importance: document.getElementById('new-importance').value || null,
    urgency: document.getElementById('new-urgency').value || null,
    action: document.getElementById('new-action').value || null,
    remind_at: document.getElementById('new-remind_at').value || null,
    deadline: document.getElementById('new-deadline').value || null,
    notes: document.getElementById('new-notes').value,
  };

  const res = await fetch('/api/tasks', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (res.ok) {
    ['new-title', 'new-remind_at', 'new-deadline', 'new-notes'].forEach(id => document.getElementById(id).value = '');
    ['new-importance', 'new-urgency', 'new-action'].forEach(id => document.getElementById(id).value = '');
    loadDetailTasks();
  } else {
    const err = await res.json().catch(() => ({}));
    showDialog(err.error || '添加失败');
  }
});

// ---------- chat conversations ----------
const convItems = document.getElementById('conv-items');
let currentConversationId = null;

function formatConvTime(stored) {
  const [datePart, timePart] = (stored || '').split(' ');
  if (!datePart || !timePart) return '';
  const [, month, day] = datePart.split('-');
  const [hh, mm] = timePart.split(':');
  return `${month}-${day} ${hh}:${mm}`;
}

async function loadConversations() {
  const res = await fetch('/api/conversations');
  let conversations = await res.json();

  if (conversations.length === 0) {
    const newId = await createConversation();
    conversations = [{ id: newId, title: null, created_at: null, updated_at: null }];
  }

  convItems.innerHTML = '';
  for (const c of conversations) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === currentConversationId ? ' active' : '');
    item.dataset.id = c.id;
    item.innerHTML = `
      <div class="conv-item-main">
        <div class="conv-title">${esc(c.title || '新对话')}</div>
        <div class="conv-time">${formatConvTime(c.updated_at)}</div>
      </div>
      <button type="button" class="conv-delete-btn" title="删除会话">×</button>
    `;
    convItems.appendChild(item);
  }

  if (currentConversationId === null) {
    await selectConversation(conversations[0].id);
  }
}

async function createConversation() {
  const res = await fetch('/api/conversations', { method: 'POST' });
  const data = await res.json();
  return data.id;
}

async function selectConversation(id) {
  currentConversationId = id;
  convItems.querySelectorAll('.conv-item').forEach(item => {
    item.classList.toggle('active', Number(item.dataset.id) === id);
  });
  await loadChatHistory();
}

document.getElementById('conv-new-btn').addEventListener('click', async () => {
  const newId = await createConversation();
  await loadConversations();
  await selectConversation(newId);
});

convItems.addEventListener('click', async e => {
  const item = e.target.closest('.conv-item');
  if (!item) return;
  const id = Number(item.dataset.id);

  if (e.target.closest('.conv-delete-btn')) {
    const title = item.querySelector('.conv-title').textContent;
    const confirmed = await showConfirm(`确定要删除"${title}"这个会话吗？删除后无法恢复。`);
    if (!confirmed) return;
    const res = await fetch(`/api/conversations/${id}`, { method: 'DELETE' });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      showDialog(err.error || '删除失败');
      return;
    }
    if (id === currentConversationId) currentConversationId = null;
    await loadConversations();
    return;
  }

  if (id !== currentConversationId) selectConversation(id);
});

// ---------- chat ----------
const chatMessages = document.getElementById('chat-messages');

function scrollChatToBottom() {
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function formatMsgTime(stored) {
  // stored as "YYYY-MM-DD HH:MM:SS" in Beijing local time (see app.py)
  const [datePart, timePart] = (stored || '').split(' ');
  if (!datePart || !timePart) return '';
  const [, month, day] = datePart.split('-');
  const [hh, mm] = timePart.split(':');
  return `${month}-${day} ${hh}:${mm}`;
}

async function setMessageFeedback(messageId, value) {
  const res = await fetch(`/api/chat/${messageId}/feedback`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ feedback: value }),
  });
  return res.ok;
}

function buildMetaRow(msgDiv, role, meta) {
  const row = document.createElement('div');
  row.className = 'msg-meta';

  const time = document.createElement('span');
  time.className = 'msg-time';
  time.textContent = formatMsgTime(meta.createdAt);
  row.appendChild(time);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'meta-btn copy-btn';
  copyBtn.title = '复制';
  copyBtn.textContent = '⧉';
  copyBtn.addEventListener('click', () => {
    const text = msgDiv.querySelector('.msg-text').textContent;
    navigator.clipboard.writeText(text)
      .then(() => { copyBtn.textContent = '✓'; setTimeout(() => { copyBtn.textContent = '⧉'; }, 1200); })
      .catch(() => showDialog('复制失败'));
  });
  row.appendChild(copyBtn);

  if (role === 'assistant' && meta.id) {
    const upBtn = document.createElement('button');
    upBtn.className = 'meta-btn feedback-btn' + (meta.feedback === 'up' ? ' active' : '');
    upBtn.title = '赞';
    upBtn.textContent = '👍';

    const downBtn = document.createElement('button');
    downBtn.className = 'meta-btn feedback-btn' + (meta.feedback === 'down' ? ' active' : '');
    downBtn.title = '踩';
    downBtn.textContent = '👎';

    const apply = async (btn, otherBtn, value) => {
      const nextValue = btn.classList.contains('active') ? null : value;
      const ok = await setMessageFeedback(meta.id, nextValue);
      if (!ok) { showDialog('操作失败，稍后再试'); return; }
      btn.classList.toggle('active', nextValue !== null);
      otherBtn.classList.remove('active');
    };

    upBtn.addEventListener('click', () => apply(upBtn, downBtn, 'up'));
    downBtn.addEventListener('click', () => apply(downBtn, upBtn, 'down'));

    row.appendChild(upBtn);
    row.appendChild(downBtn);
  }

  return row;
}

const ACTION_MARKER_RE = /\n?\[\[ACTION:(plan_confirm|add_confirm)\]\]\s*$/;

function renderChoiceButtons(msgDiv, action) {
  const labels = action === 'plan_confirm' ? ['满意', '不满意'] : ['加入', '不加入'];
  const row = document.createElement('div');
  row.className = 'msg-choices';

  const buttons = labels.map(label => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = label;
    row.appendChild(btn);
    return btn;
  });

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => { b.disabled = true; });
      btn.classList.add('chosen');
      sendChat(btn.textContent);
    });
  });

  msgDiv.appendChild(row);
}

function appendMessage(role, content, meta) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;

  const textEl = document.createElement('div');
  textEl.className = 'msg-text';
  textEl.innerHTML = renderMarkdown(content);
  div.appendChild(textEl);

  if (meta) div.appendChild(buildMetaRow(div, role, meta));

  chatMessages.appendChild(div);
  scrollChatToBottom();
  return div;
}

async function loadChatHistory() {
  if (currentConversationId === null) return;
  const res = await fetch(`/api/chat/history?conversation_id=${currentConversationId}`);
  const history = await res.json();
  chatMessages.innerHTML = '';
  if (history.length === 0) {
    appendMessage('assistant', '嗨，想做什么事、或者想聊聊某个计划，直接跟我说就行。');
    return;
  }
  for (const m of history) {
    appendMessage(m.role, m.content, { id: m.id, createdAt: m.created_at, feedback: m.feedback });
  }
}

let activeAbortController = null;

async function sendChat(presetText) {
  const input = document.getElementById('chat-input');
  const btn = document.getElementById('chat-send-btn');
  const stopBtn = document.getElementById('chat-stop-btn');
  const text = presetText !== undefined ? presetText : input.value.trim();
  if (!text) return;
  // Guards against a duplicate send while one is already in flight -- the
  // send button disables itself below, but the Enter-key handler and the
  // choice buttons both call sendChat() directly without checking that, so
  // without this a second Enter press (or a choice-button click racing an
  // in-flight request) could fire a second identical /api/chat call, each
  // producing its own correct-but-duplicated reply.
  if (activeAbortController) return;

  appendMessage('user', text);
  if (presetText === undefined) input.value = '';
  btn.disabled = true;
  stopBtn.style.display = 'inline-block';

  const assistantDiv = appendMessage('assistant streaming', '…');
  const textEl = assistantDiv.querySelector('.msg-text');

  const controller = new AbortController();
  activeAbortController = controller;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, conversation_id: currentConversationId }),
      signal: controller.signal,
    });

    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      assistantDiv.classList.remove('streaming');
      textEl.textContent = data.error || '出错了，稍后再试试';
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let full = '';
    let started = false;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const piece = decoder.decode(value, { stream: true });
      if (!piece) continue;
      if (!started) { started = true; full = ''; }
      full += piece;
      const displayText = full.replace(ACTION_MARKER_RE, '');
      textEl.innerHTML = renderMarkdown(displayText);
      scrollChatToBottom();
    }

    assistantDiv.classList.remove('streaming');
    const match = full.match(ACTION_MARKER_RE);
    const cleanText = full.replace(ACTION_MARKER_RE, '');
    textEl.innerHTML = cleanText ? renderMarkdown(cleanText) : '（没有收到回复）';
    await loadChatHistory();
    await loadConversations();
    if (match) {
      const lastMsg = chatMessages.querySelector('.msg.assistant:last-child');
      if (lastMsg) renderChoiceButtons(lastMsg, match[1]);
    }
  } catch (err) {
    assistantDiv.classList.remove('streaming');
    if (err.name === 'AbortError') {
      textEl.innerHTML += '<br><em style="opacity:.6">（已停止）</em>';
    } else {
      textEl.textContent = '网络出错了，稍后再试试';
    }
  } finally {
    activeAbortController = null;
    btn.disabled = false;
    stopBtn.style.display = 'none';
    input.focus();
  }
}

document.getElementById('chat-send-btn').addEventListener('click', () => sendChat());
document.getElementById('chat-stop-btn').addEventListener('click', () => {
  if (activeAbortController) activeAbortController.abort();
});
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});

loadCategoryGrid();
loadConversations();
</script>
